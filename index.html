function lookbook(){const a=[['Au quotidien','main','#E8CDB0','Sacs à main','#/categorie/main'],['En soirée','poch','#D9B5AA','Pochettes','#/categorie/poch'],['Week-end','dos','#C9D2C0','Sacs à dos','#/categorie/dos']];return`<section class='sec'><h2 class='rev' style='font-size:40px;margin-bottom:22px'>Lookbook</h2><div class='lb'>${a.map((x,i)=>`<a class='rev' href='${x[4]}' style='background:${x[2]};transition-delay:${i*.12}s'>${art(P.find(p=>p.c==x[1]),i==1?'Bordeaux':i==2?'Marine':'Caramel',i+1)}<div><span>${x[3]}</span><h3>${x[0]}</h3></div></a>`).join('')}</div></section>`}
function steps(){const a=[['Choisissez','Parcourez la boutique et trouvez votre pièce.'],['Ajoutez','Sélectionnez couleur et quantité, puis le panier.'],['Envoyez sur WhatsApp','Un message prérempli part vers notre équipe.'],['Confirmation','Nous confirmons stock, livraison et délai.']];return`<section class='sec'><h2 class='rev' style='font-size:40px;margin-bottom:22px'>Commander via WhatsApp</h2><div class='stp'>${a.map((x,i)=>`<div class='st rev' style='transition-delay:${i*.12}s'><em>0${i+1}</em><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><p style='text-align:center;margin-top:26px'><button class='btn wa' data-act='wafab'>Commander sur WhatsApp</button></p></section>`}
function reviews(){return`<section class='sec'><h2 class='rev' style='font-size:40px;margin-bottom:6px'>Avis clients</h2><p class='rev'><b>4,9 / 5</b> ★★★★★ · <small>Avis fictifs — données de démonstration.</small></p><div class='mq rev' style='margin-top:18px'><div class='mt'>${[...RV,...RV].map(r=>`<div class='rc'><p>★★★★★</p><p>« ${r[1]} »</p><b>${r[0]}</b> <small>· ${r[2]}</small></div>`).join('')}</div></div></section>`}
let pq=1,pc=null,pv=0;
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t){if(e.target.classList.contains('mod'))e.target.remove();return}const a=t.dataset.act,id=+t.dataset.id,pp=t.closest('[data-pid]'),pid=pp?+pp.dataset.pid:0;
if(a=='add')add(id);else if(a=='fav')tf(id);else if(a=='qv')qv(id);else if(a=='cm')document.querySelector('.mod')?.remove();
else if(a=='more'){S.n+=8;shopGrid()}else if(a=='reset'){S={q:'',cat:'',min:'',max:'',col:'',st:false,promo:false,sort:'pop',n:8};document.querySelectorAll('[data-f]').forEach(i=>i.type=='checkbox'?i.checked=false:i.value=i.dataset.f=='sort'?'pop':'');shopGrid()}
else if(a=='rmf'){const k=t.dataset.k;S[k]=(k=='st'||k=='promo')?false:'';const i=document.querySelector(`[data-f=${k}]`);if(i)i.type=='checkbox'?i.checked=false:i.value='';shopGrid()}
else if(a=='ft')$('#fa').classList.toggle('open');
else if(a=='zoom')t.classList.toggle('z');
else if(a=='th'){pv=+t.dataset.v;document.querySelectorAll('.th button').forEach(b=>b.classList.toggle('on',b==t));$('#gm').innerHTML=art(byId(pid),pc||byId(pid).cl[0],pv)}
else if(a=='col'){pc=t.dataset.c;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b==t));$('#cn').textContent=pc;$('#gm').innerHTML=art(byId(pid),pc,pv);document.querySelectorAll('.th button').forEach((b,i)=>b.innerHTML=art(byId(pid),pc,i))}
else if(a=='qm'){pq=Math.max(1,pq-1);$('#qn').textContent=pq}else if(a=='qp'){pq=Math.min(10,pq+1);$('#qn').textContent=pq}
else if(a=='addp'){add(pid,pc||byId(pid).cl[0],pq)}
else if(a=='wap'){const p=byId(pid),c=pc||p.cl[0];wa(`Bonjour ${CFG.name}, je souhaite commander le produit suivant :\n\nProduit : ${p.n}\nRéférence : ${p.ref}\nCouleur : ${c}\nQuantité : ${pq}\nPrix unitaire : ${fmt(p.p)}\nTotal produit : ${fmt(p.p*pq)}\n\nPouvez-vous me confirmer la disponibilité, les frais de livraison et le délai de livraison ?\n\nMerci.`)}
else if(a=='cq'){const l=cart[+t.dataset.i];l.q=Math.max(1,Math.min(10,l.q+ +t.dataset.d));save();route()}
else if(a=='rm'){cart.splice(+t.dataset.i,1);save();route()}else if(a=='clr'){cart=[];save();route()}
else if(a=='wac')wa(msgCart());else if(a=='waq')waQ(id);else if(a=='wafab')cart.length?wa(msgCart()):wa(`Bonjour ${CFG.name}, je souhaite passer commande. Pouvez-vous m'aider ?`);else if(a=='cp')cg(ci-1);else if(a=='cnx')cg(ci+1);else if(a=='cd')cg(+t.dataset.i);else if(a=='wag')wa(`Bonjour ${CFG.name}, j'ai une question.`)});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;S[f]=e.target.type=='checkbox'?e.target.checked:e.target.value;S.n=8;shopGrid()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
if(f=='sf'){location.hash='#/recherche?q='+encodeURIComponent($('#sq').value.trim());$('#sq').value=''}
if(f=='nl'){const v=$('#ne').value.trim(),m=$('#nm');if(!/^\S+@\S+\.\S+$/.test(v)){m.textContent='Veuillez saisir un email valide.';return}m.style.color='#2f6b4f';m.textContent='Merci ! (Simulation : aucun email n\'a été envoyé.)';e.target.reset()}
if(f=='co'){const g=i=>$(i).value.trim(),n=g('#cn1'),tl=g('#ct'),c=g('#cv');$('#e1').textContent=n?'':'Nom requis';$('#e2').textContent=/^[+\d][\d\s.-]{7,}$/.test(tl)?'':'Téléphone valide requis';$('#e3').textContent=c?'':'Ville requise';if(!n||!/^[+\d][\d\s.-]{7,}$/.test(tl)||!c)return;wa(msgCart({name:n,tel:tl,city:c,addr:g('#ca'),note:g('#cx'),ex:+$('#cd').value}))}});
document.addEventListener('change',e=>{if(e.target.id=='cd')$('#rc').innerHTML=rec2(+e.target.value)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')document.querySelector('.mod')?.remove()});
window.addEventListener('scroll',()=>{const h=$('#hv svg');if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches)h.style.transform=`translateY(${Math.min(scrollY*.06,24)}px) scale(1.04)`},{passive:true});
window.addEventListener('hashchange',()=>{pq=1;pc=null;pv=0;route()});
$('#ann').textContent=CFG.ann;$('#logo').textContent=CFG.name;$('#fl').textContent=CFG.name;$('#fct').textContent=CFG.email+' · '+CFG.tel;
$('#nv').innerHTML=`<a href="#/">Accueil</a><div class="dd"><a href="#/boutique">Boutique ▾</a><div>${Object.entries(CATS).map(([k,v])=>`<a href="#/categorie/${k}">${v}</a>`).join('')}</div></div><a href="#/boutique?s=new">Nouveautés</a><a href="#/boutique?promo=1">Promotions</a>`;
$('#fcat').innerHTML=Object.entries(CATS).map(([k,v])=>`<a href="#/categorie/${k}">${v}</a>`).join('');
$('#bg').onclick=()=>$('#nv').classList.toggle('open');
badges();route();const fb=document.createElement('button');fb.className='fab';fb.dataset.act='wafab';fb.textContent='WhatsApp · Commander';fb.setAttribute('aria-label','Commander sur WhatsApp');document.body.append(fb);
</script></body></html>
